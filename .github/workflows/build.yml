name: Build and Package Opalo (Windows)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Upload Opalo executable
        uses: actions/upload-artifact@v4
        with:
          name: Opalo-Windows-x64
          path: build/Opalo_artefacts/Release/Opalo.exe
          if-no-files-found: error

      - name: Install Inno Setup
        if: github.event_name != 'pull_request'
        run: choco install innosetup --yes --no-progress

      - name: Download Microsoft Visual C++ Runtime
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: Invoke-WebRequest -Uri https://aka.ms/vs/17/release/vc_redist.x64.exe -OutFile installer\vc_redist.x64.exe

      - name: Prepare installer output folder
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path dist | Out-Null

      - name: Build Windows installer
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\Opalo.iss'

      - name: Upload Opalo installer
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Opalo-Installer-Windows-x64
          path: dist/Opalo-Setup-Windows-x64.exe
          if-no-files-found: error
