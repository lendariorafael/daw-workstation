name: Build (Windows)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Upload Opalo build
        uses: actions/upload-artifact@v4
        with:
          name: Opalo-Windows-x64
          path: build/Opalo_artefacts/Release/*.exe
          if-no-files-found: error
